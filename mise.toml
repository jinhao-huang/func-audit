[tools]
node = "24.18.1"
pnpm = "11.20.0"
ripgrep = "15.1.0"

[tasks.setup]
description = "Create local API settings and install locked dependencies"
run = '''
if [ ! -f mise.local.toml ]; then
  (umask 077 && cp mise.local.toml.example mise.local.toml)
  echo "Created mise.local.toml. Set FUNC_AUDIT_API_KEY there or in your shell."
else
  echo "Keeping existing mise.local.toml."
fi
pnpm install --frozen-lockfile
'''

[tasks.dev]
description = "Open the local development server"
run = "pnpm dev"

[tasks.prepare]
description = "Prepare the course pair manifest"
raw_args = true
run = "node src/cli.ts prepare"

[tasks.audit]
description = "Audit both samples in a course pair"
raw_args = true
run = "node src/cli.ts audit"

[tasks.report]
description = "Show the reports from a run"
raw_args = true
run = "node src/cli.ts report"

[tasks.score]
description = "Grade a completed pair run"
raw_args = true
run = "node src/cli.ts score"

[tasks.export]
description = "Export predictions from a completed pair run"
raw_args = true
run = "node src/cli.ts export"
